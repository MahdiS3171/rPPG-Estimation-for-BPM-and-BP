name: Research synthetic checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[scamps]"
      - name: Historical contracts and optional adaptation (synthetic only)
        run: python -m scripts.verify_waveform_v2_safe
      - name: Streaming, optical and classical contracts (synthetic only)
        run: python -m scripts.verify_waveform_v2_classical_safe
      - name: Acquisition identifiability controls
        run: python -c "from scripts.audit_camera_timing_identifiability import controls; print(controls())"
      - name: Source-balanced baseline contracts
        run: python -m unittest discover -s tests -p test_two_source_waveform.py -v
      - name: Adaptive waveform and loss contracts
        run: python -m unittest discover -s tests -p test_waveform_screen.py -v
      - name: Extended waveform architecture contracts
        run: python -m unittest discover -s tests -p test_waveform_extensions.py -v
      - name: Public research reset split contracts
        run: python -m unittest discover -s tests -p test_waveform_research_split.py -v
      - name: Three-part feature and gradient-isolation contracts
        run: python -m unittest discover -s tests -p test_waveform_feature_specialists.py -v
      - name: Native pilot pixel-equivalence contracts
        run: python -m unittest discover -s tests -p test_pilot11_acquisition.py -v
      - name: Pilot inference and BP separation contracts
        run: python -m unittest discover -s tests -p test_pilot11_evaluation.py -v
      - name: Source compilation
        run: python -m compileall -q rppg_lab scripts tests
