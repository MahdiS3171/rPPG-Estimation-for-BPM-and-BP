[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg-lab"
version = "0.2.0"
description = "Research code for remote PPG, heart-rate, and pilot blood-pressure experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "opencv-python>=4.8",
  "mediapipe>=0.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "tqdm>=4.66",
  "torch>=2.0",
]

[tool.setuptools]
packages = ["rppg_lab"]
